<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Costume Contest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            color: #ff6b35;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #ccc;
            font-size: 0.9em;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ff6b35;
            font-size: 1.1em;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ff6b35;
            background: rgba(255, 255, 255, 0.1);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #4CAF50;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .already-voted {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #FFC107;
            color: #FFC107;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }

        .admin-link {
            text-align: center;
            margin-top: 20px;
        }

        .admin-link a {
            color: #ff6b35;
            text-decoration: none;
            font-size: 0.9em;
            opacity: 0.7;
        }

        .admin-link a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎃 Costume Contest 🎃</h1>
        <p class="subtitle">Vote for your favorites!</p>
		<p class="subtitle">NOTE: You can only vote onece, so make it count!</p>

        <div class="form-card" id="votingForm">
            <form id="voteForm">
                <div class="form-group">
                    <label for="funniest">Funniest Costume</label>
                    <input type="text" id="funniest" name="funniest" placeholder="Enter costume name" required>
                </div>

                <div class="form-group">
                    <label for="creative">Most Creative Costume</label>
                    <input type="text" id="creative" name="creative" placeholder="Enter costume name" required>
                </div>

                <div class="form-group">
                    <label for="leastEffort">Least Effort Costume</label>
                    <input type="text" id="leastEffort" name="leastEffort" placeholder="Enter costume name" required>
                </div>

                <button type="submit" id="submitBtn">Submit Votes</button>
            </form>

            <div class="message" id="message"></div>
        </div>

        <div class="already-voted" id="alreadyVoted" style="display: none;">
            <h2>✅ Already Voted!</h2>
            <p style="margin-top: 10px;">You've already submitted your votes. Thanks for participating!</p>
        </div>

        <div class="admin-link">
            <a href="admin.html">Admin Login</a>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        // TODO: Replace with your Google Apps Script Web App URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzMSaSilJoDagfDWdMTDGsfYZyIxD5fVjc0ItgDQ58qIGtsyJlVh6b2EC9U7zi1_gLa/exec';
        // ======================================================

        // Check if user has already voted
        function hasVoted() {
            return localStorage.getItem('hasVoted') === 'true';
        }

        // Mark user as voted
        function markAsVoted() {
            localStorage.setItem('hasVoted', 'true');
        }

        // Initialize page
        function init() {
            if (hasVoted()) {
                document.getElementById('votingForm').style.display = 'none';
                document.getElementById('alreadyVoted').style.display = 'block';
            }
        }

        // Show message
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
        }

        // Submit vote to Google Apps Script
        async function submitVote(funniest, creative, leastEffort) {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    funniest: funniest,
                    creative: creative,
                    leastEffort: leastEffort
                })
            });

            // Note: no-cors mode means we can't read the response,
            // but the submission will still work
            return true;
        }

        // Handle form submission
        document.getElementById('voteForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const funniest = document.getElementById('funniest').value.trim();
            const creative = document.getElementById('creative').value.trim();
            const leastEffort = document.getElementById('leastEffort').value.trim();

            try {
                await submitVote(funniest, creative, leastEffort);
                markAsVoted();
                showMessage('✅ Vote submitted successfully!', 'success');
                
                setTimeout(() => {
                    document.getElementById('votingForm').style.display = 'none';
                    document.getElementById('alreadyVoted').style.display = 'block';
                }, 2000);
            } catch (error) {
                console.error('Error:', error);
                showMessage('❌ Error submitting vote. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Votes';
            }
        });

        // Initialize on page load
        init();
    </script>
</body>
</html>
